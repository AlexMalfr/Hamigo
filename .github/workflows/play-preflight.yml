name: Play API preflight
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Archived immutable release tag to verify (no rebuild or upload)
        required: true
        default: v1.0
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: hamigo-play
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      HAMIGO_UPLOAD_CERT_SHA256: ${{ vars.HAMIGO_UPLOAD_CERT_SHA256 }}
    steps:
      - name: Validate release tag input
        run: |
          [[ "$RELEASE_TAG" =~ ^v[1-9][0-9]*\.[0-9]+(\.[0-9]+)?(-(alpha|beta)[1-9][0-9]*)?$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Retrieve and verify exact archived bundle
        run: |
          mkdir -p output/preflight
          python tools/play/download_archive.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --folder output/preflight
          python tools/play/check_archive.py --tag "$RELEASE_TAG" --folder output/preflight
          python tools/play/verify_signature.py "output/preflight/Hamigo-${RELEASE_TAG}.aab"
      - name: Authenticate from protected main without build secrets
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Read actual Publisher API track IDs
        run: |
          python -m pip install 'google-auth[requests]>=2,<3'
          python tools/play/publish.py --list-tracks | tee output/preflight/tracks.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: play-preflight-${{ inputs.release_tag }}
          path: output/preflight/tracks.json
          if-no-files-found: error
          retention-days: 14
